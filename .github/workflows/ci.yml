name: CI

# Manual-only: CI runs when you start it from the Actions tab or via
# `gh workflow run ci.yml`, not automatically on push or pull_request.
on:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The rod browser-automation package is vendored and excluded from vet/test
  # the same way the Makefile does it.
  GOFLAGS: -mod=readonly

jobs:
  build-and-test:
    name: Lint, vet & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # jstangle is compiled with bun and embedded via //go:embed
      # (internal/resources/deparos/jstangle/jstangle-linux-amd64). That file is
      # generated, not committed, so the tree won't build until it exists.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build embedded jstangle binaries
        run: make ensure-jstangle

      - name: Verify jstangle contracts and mandatory bundle corpus
        run: |
          cd platform/jstangle
          bun run test:ci
          cd ../..
          make verify-jstangle-fresh

      - name: Verify generated/managed sources (gofmt + go.mod tidy)
        run: make verify-generated

      # Filter mirrors GOLIST_EXCLUDE in the Makefile: drop vendored rod browser
      # tests and external tooling under platform/ (incl. node_modules trees that
      # can hold stray buildable Go packages).
      - name: go vet
        run: go vet $(go list ./... | grep -Ev '/pkg/spitolas/rod|/platform/|/node_modules/')

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Unit tests
        run: go test -short -coverprofile=coverage.out $(go list ./... | grep -Ev '/pkg/spitolas/rod|/platform/|/node_modules/')

      # Enforce the coverage floor against the profile produced above (no second
      # test run). Reuses the same COVERAGE_MIN gate as `make test-ci`.
      - name: Enforce coverage floor
        run: make coverage-gate

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    # The shipped matrix includes windows/amd64, but every other job here runs
    # natively on linux — so nothing else would notice a unix-only import (a
    # bare syscall call, an os/exec of `bash`) until release day. This job is
    # the guard: it compiles and vets the whole tree for the target GOOS.
    # windows/arm64 is deliberately absent — the Bun-compiled helper binaries
    # have no such target, so it is not shipped (see .goreleaser.yaml).
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # The target platform's jstangle binary must exist for its go:embed to
      # resolve. Only that one is built — the other four are irrelevant here.
      - name: Stage jstangle for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: make build-jstangle-target JSTANGLE_TARGET=${{ matrix.goos }}-${{ matrix.goarch }}

      # vet type-checks every package including tests; the build additionally
      # proves the main binary links. The audit blob is not needed — `all:_bin`
      # matches the empty embed dir and surfaces as a runtime error instead.
      - name: Vet and build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go vet $(go list ./... | grep -Ev '/pkg/spitolas/rod|/platform/|/node_modules/')
          go build -o vigolium-${{ matrix.goos }}-${{ matrix.goarch }}.exe ./cmd/vigolium

      - name: Upload binary for the runtime smoke test
        uses: actions/upload-artifact@v4
        with:
          name: vigolium-${{ matrix.goos }}-${{ matrix.goarch }}
          path: vigolium-${{ matrix.goos }}-${{ matrix.goarch }}.exe
          retention-days: 1

  windows-smoke:
    name: Windows runtime smoke
    needs: cross-compile
    runs-on: windows-latest
    # Cross-compiling proves the tree builds for Windows; it proves nothing
    # about whether the binary RUNS there. This job exercises the artifact the
    # release actually ships — process start, config load, DB open, command
    # dispatch — none of which a linux-hosted `go build` can reach. It
    # deliberately downloads the cross-built exe rather than rebuilding, so the
    # runner needs neither Go nor Bun.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vigolium-windows-amd64

      - name: Version and command dispatch
        shell: pwsh
        run: |
          $exe = ".\vigolium-windows-amd64.exe"
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "version exited $LASTEXITCODE" }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

      # Opens the SQLite store and writes to %USERPROFILE% — the paths most
      # likely to break on Windows and invisible to a compile-only check.
      - name: Database and project initialization
        shell: pwsh
        run: |
          $exe = ".\vigolium-windows-amd64.exe"
          & $exe project list
          if ($LASTEXITCODE -ne 0) { throw "project list exited $LASTEXITCODE" }
          & $exe module ls | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "module ls exited $LASTEXITCODE" }

  coverage-report:
    name: Combined coverage (report only)
    runs-on: ubuntu-latest
    # Report-only: this never gates a merge. The enforced floor lives in the
    # build-and-test job above (coverage-gate over the -short unit profile).
    # This job folds in the no-Docker e2e tier so the headline number reflects
    # code exercised end-to-end (REST handlers, scan-runner orchestration) that
    # per-package unit coverage can't credit. No Docker required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build embedded jstangle binaries
        run: make ensure-jstangle

      - name: Combined coverage report
        run: make coverage-combined

      - name: Upload combined coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: |
            coverage-combined.html
            coverage-combined.out
          if-no-files-found: ignore

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    # Informational: advisories can appear without any code change, so a finding
    # here should prompt a triage rather than hard-fail every unrelated PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build embedded jstangle binaries
        run: make ensure-jstangle

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck $(go list ./... | grep -Ev '/pkg/spitolas/rod|/platform/|/node_modules/')

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    # Informational supply-chain artifact, not a gate. syft reads go.mod
    # directly, so this needs neither a build nor the embedded jstangle binaries.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: vigolium-sbom.cdx.json

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Diffs the dependency graph against the PR base for known-vulnerable or
    # license-incompatible additions; only meaningful on pull requests.
    if: github.event_name == 'pull_request'
    # Non-blocking for now (mirrors the govulncheck stance): surface advisories
    # for triage rather than hard-failing unrelated PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
